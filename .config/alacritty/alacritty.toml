[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
startup_mode = "Fullscreen"
option_as_alt = "Both"
padding = { x = 0, y = 0 }

[scrolling]
history = 10000

[font]
size = 16.0

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Medium"

[font.bold]
family = "JetBrainsMonoNL Nerd Font"
style = "Medium"

[font.italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Medium"

[font.bold_italic]
family = "JetBrainsMonoNL Nerd Font"
style = "Medium"

[font.offset]
y = 24

[cursor]
style = { shape = "Beam", blinking = "Off" }

[mouse]
hide_when_typing = true

[colors.primary]
background = "#161617"
foreground = "#c9c7cd"

[colors.selection]
background = "#353539"
text = "#c9c7cd"

[colors.cursor]
cursor = "#c9c7cd"
text = "#161617"

[colors.normal]
black = "#27272a"
red = "#d4b5a0"
green = "#968a7c"
yellow = "#d4b5a0"
blue = "#968a7c"
magenta = "#968a7c"
cyan = "#968a7c"
white = "#c9c7cd"

[colors.bright]
black = "#353539"
red = "#dfc2ad"
green = "#b3a193"
yellow = "#dfc2ad"
blue = "#b3a193"
magenta = "#b3a193"
cyan = "#b3a193"
white = "#d4d2d8"
